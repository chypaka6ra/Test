<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      /* Using Google Fonts for immediate display */
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap');

      .maria-text {
        font-family: 'Cinzel Decorative', serif;
        font-size: 96px;
        font-weight: 700;
        fill: #E389B2;
        text-anchor: middle;
        letter-spacing: 3px;
      }

      .decorative-elements {
        stroke: #E389B2;
        opacity: 0.3;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#ffffff"/>

  <!-- Decorative corner elements -->
  <circle cx="60" cy="60" r="10" fill="#E389B2" opacity="0.2"/>
  <circle cx="540" cy="240" r="10" fill="#E389B2" opacity="0.2"/>

  <!-- Decorative curves for wedding aesthetic -->
  <path class="decorative-elements" d="M 80 80 Q 120 90 160 80" stroke-width="1.5" fill="none"/>
  <path class="decorative-elements" d="M 440 220 Q 480 230 520 220" stroke-width="1.5" fill="none"/>

  <!-- Main text - "Мария" (Maria in Russian/Cyrillic) -->
  <text x="300" y="180" class="maria-text">Мария</text>

  <!-- Decorative line separator -->
  <line x1="100" y1="210" x2="500" y2="210" stroke="#E389B2" stroke-width="1" opacity="0.4"/>
</svg>
